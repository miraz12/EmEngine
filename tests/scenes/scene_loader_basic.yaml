# Fixture for SceneLoaderTest (unit tests, no GL context available).
# Deliberately avoids the "Gra" component type: GraphicsComponent primitives
# (Cube/Quad/Mesh/Heightmap) construct GPU resources via
# gfx::RenderResources::getInstance() at construction time, which is unsafe
# without an initialized GraphicsDevice — see tests/scene_loader_tests.cpp.
- entity: physics_box
  components:
    - type: Pos
      position: [1.5, 2.5, -3.0]
      rotation: [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
    - type: Phy
      mass: 12.5
      shape: 0

- entity: sun
  components:
    - type: Lig
      lightType: dir
      color: [0.988, 0.898, 0.439]
      direction: [0.01, -1.0, 0.0]
      ambient: 0.5

- entity: lamp
  components:
    - type: Lig
      lightType: point
      color: [0.0, 1.0, 0.0]
      position: [1.5, 1.0, 0.0]
      constant: 1.0
      linear: 0.7
      quadratic: 1.8

- entity: main_camera
  components:
    - type: Cam
      position: [0.0, 2.0, 10.0]
      target: [0.0, 0.0, 0.0]
      up: [0.0, 1.0, 0.0]
      fov: 60.0
      near: 0.5
      far: 500.0
      width: 1920.0
      height: 1080.0
      main: true
